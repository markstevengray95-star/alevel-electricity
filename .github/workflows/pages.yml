name: Deploy static app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load latest learning, marking and simulation modules
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          modules=[
            'simulation-performance-v3.js?v=1',
            'equation-breakdown-v3.js?v=1',
            'equation-operator-compat-v4.js?v=1',
            'lesson-automark-v3.js?v=1',
            'learning-stable-v6.js?v=1',
            'simulation-smooth-v4.js?v=1',
            'question-automark-v4.js?v=1',
            'integration-fixes-v5.js?v=1',
            'extended-response-hub-v1.js?v=1',
          ]
          inject='\n'+'\n'.join(f'<script src="{m}"></script>' for m in modules)+'\n'
          if 'extended-response-hub-v1.js' not in s:
              s=s.replace('</body>', inject+'</body>')
          p.write_text(s)
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
